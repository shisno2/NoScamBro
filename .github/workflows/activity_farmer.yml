name: 24/7 GitHub Activity Farmer

on:
  schedule:
    # Ultra mode: runs every hour throughout day and night
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  farm-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Farm Activity Ultra Batch
        run: |
          for i in {1..5}; do
            python activity_farmer.py --name "Kolyancat12888888" --email "shisno21@gmail.com" --no-push tick
          done
          git push origin main
